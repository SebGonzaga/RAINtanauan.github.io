<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("rain_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Virtual Assistance — RAIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="app-shell-root"></div>

<template id="va-content">
  <div class="chat-shell reveal-on-scroll">
    <div class="chat-header">
      <div class="chat-title">
        <span class="chat-badge"><i class="bi bi-robot dicon" style="color:var(--accent-cyan-hover);" data-dicon="robot"></i></span>
        <span>Virtual Assistance</span>
        <span class="chat-status" title="Assistant is ready"><span class="chat-status-dot"></span><span class="chat-status-label">Online</span></span>
      </div>
      <div class="chat-sub">General disaster guidance — not a substitute for emergency services</div>
      <div class="chat-controls">
        <div class="lang-toggle" role="group" aria-label="Reply language">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="fil">FIL</button>
        </div>
        <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" id="clearChatBtn" aria-label="Clear chat" data-press><i class="bi bi-trash3 dicon" data-dicon="trash3"></i> <span class="btn-label">Clear Chat</span></button>
      </div>
    </div>

    <div class="chat-stage">
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Chat messages"></div>
      <button type="button" class="chat-scroll-btn" id="chatScrollBtn" aria-label="Jump to latest message"><i class="bi bi-arrow-down"></i><span>Latest</span></button>
    </div>

    <form class="chat-input-row" id="chatForm">
      <input type="text" id="chatInput" placeholder="Ask about earthquakes, typhoons, floods, eruptions…" aria-label="Type your question" autocomplete="off" enterkeyhint="send" autocapitalize="sentences" maxlength="500">
      <button type="submit" class="chat-send-btn" id="chatSendBtn" aria-label="Send message"><i class="bi bi-send dicon" data-dicon="send"></i></button>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/rain-auth.js"></script>
<script src="assets/js/offline-store.js"></script>
<script src="assets/js/main.js"></script>
<script type="module">
  await RainAuth.init();
  const user = renderAppShell("virtual-assistance.html", { title: "Virtual Assistance" });
  let currentLang = "en";
  const STORAGE_KEY = "rain_chat_" + (user ? user.email : "guest");

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveHistory(history) { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }

  const TOPICS = {
    en: [
      { icon: "cloud-sun", tone: "cyan", label: "Weather", prompt: "What's the weather like right now?" },
      { icon: "activity", tone: "warning", label: "Quakes", prompt: "Any earthquakes today?" },
      { icon: "house", tone: "safe", label: "Shelters", prompt: "Where is the nearest evacuation center?" },
      { icon: "exclamation-triangle", tone: "critical", label: "Emergency", prompt: "What should I do in an emergency?" },
    ],
    fil: [
      { icon: "cloud-sun", tone: "cyan", label: "Panahon", prompt: "Ano ang lagay ng panahon ngayon?" },
      { icon: "activity", tone: "warning", label: "Lindol", prompt: "May lindol ba ngayon?" },
      { icon: "house", tone: "safe", label: "Evacuation", prompt: "Saan ang pinakamalapit na evacuation center?" },
      { icon: "exclamation-triangle", tone: "critical", label: "Emergency", prompt: "Ano ang dapat gawin sa emergency?" },
    ],
  };

  function greeting() {
    const h = new Date().getHours();
    if (currentLang === "fil") return h < 12 ? "Magandang umaga" : h < 18 ? "Magandang hapon" : "Magandang gabi";
    return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  function emptyStateHtml() {
    const fil = currentLang === "fil";
    const title = fil ? `${greeting()} — ako si RAIN` : `${greeting()} — I'm RAIN`;
    const sub = fil
      ? "Kaya kong tingnan ang live na panahon, lindol, alerto at evacuation center. Pumili ng paksa o mag-type ng tanong."
      : "I can check live weather, earthquakes, alerts and shelters for you. Pick a topic or type a question.";
    const topics = TOPICS[currentLang].map((t) =>
      `<button type="button" class="va-topic-btn tone-${t.tone}" data-topic="${t.prompt}"><span class="ico"><i class="bi bi-${t.icon} dicon" data-dicon="${t.icon}"></i></span>${t.label}</button>`
    ).join("");
    return `<div class="empty-state va-hero" id="chatEmptyState">
      <div class="va-orb"><span class="va-orb-ring"></span><span class="va-orb-ring r2"></span><div class="va-orb-core"><i class="bi bi-robot dicon" data-dicon="robot"></i></div></div>
      <h2 class="va-hero-title">${title}</h2>
      <p class="va-hero-sub">${sub}</p>
      <div class="va-topic-grid">${topics}</div>
    </div>`;
  }

  // Contextual follow-up suggestions shown under each reply. Phrased so none
  // of them trip detectDataIntent() (which would redirect to a live-data page
  // instead of asking the AI).
  const FOLLOWUPS = {
    en: {
      earthquake: ["What to do while the ground shakes?", "Where is the nearest evacuation center?", "Safety steps after shaking stops"],
      flood: ["How do I stay safe in a flood?", "Are there any active alerts for my area?", "Protect my home from rising water"],
      typhoon: ["Show the 3-day forecast for my area", "What do I do before a storm hits?", "Prepare an emergency kit"],
      volcano: ["Which way is the wind blowing at Taal?", "What to do during ashfall?", "Make a household evacuation plan"],
      default: ["Are there any active alerts for my area?", "Emergency kit essentials", "Make a family emergency plan"],
    },
    fil: {
      earthquake: ["Dapat gawin habang yumayanig", "Saan ang pinakamalapit na evacuation center?", "Mga hakbang pagkatapos ng pagyanig"],
      flood: ["Paano maging ligtas sa baha?", "May aktibong alerto ba sa aking lugar?", "Protektahan ang bahay sa baha"],
      typhoon: ["Ano ang forecast sa aking lugar?", "Paghahanda bago dumating ang bagyo", "Ano ang laman ng emergency kit?"],
      volcano: ["Saan patungo ang hangin sa Taal?", "Dapat gawin kapag may ashfall", "Gumawa ng family evacuation plan"],
      default: ["May aktibong alerto ba sa aking lugar?", "Mahahalagang laman ng emergency kit", "Gumawa ng family emergency plan"],
    },
  };
  const INTENT_TO_CATEGORY = { weather: "typhoon", earthquake: "earthquake", volcano: "volcano" };

  function clearFollowups() {
    document.querySelectorAll("#chatMessages .va-chips").forEach((n) => n.remove());
  }
  function showFollowups(category) {
    clearFollowups();
    const host = document.getElementById("chatMessages");
    const pool = FOLLOWUPS[currentLang] || FOLLOWUPS.en;
    const list = pool[category] || pool.default;
    const wrap = document.createElement("div");
    wrap.className = "va-chips";
    wrap.setAttribute("role", "group");
    wrap.setAttribute("aria-label", "Suggested follow-up questions");
    list.forEach((label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "va-chip";
      b.dataset.topic = label;
      b.innerHTML = '<i class="bi bi-stars"></i>';
      b.appendChild(document.createTextNode(label));
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
    RainAnim.animateChips(wrap);
    updateScrollBtn();
  }

  // Gemini returns markdown (**bold**, "- " bullet lines, blank-line
  // paragraphs) as plain text. Browsers don't interpret that on their own,
  // and by default collapse newlines/whitespace, which is why replies were
  // showing up as one run-on line with literal asterisks. This converts
  // that markdown into real HTML before it goes into the bubble.
  // Deliberately small/naive (bold, links, bullet lists, paragraphs) --
  // it's just enough for the kind of formatting Gemini tends to use here,
  // not a general-purpose markdown parser.
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function renderMarkdown(text) {
    const escaped = escapeHtml(text);
    // Split into blocks on blank lines; each block is either a run of
    // "- "/"* " bullet lines or a plain paragraph.
    const blocks = escaped.trim().split(/\n\s*\n/);
    const html = blocks.map((block) => {
      const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
      const isList = lines.length > 0 && lines.every((l) => /^[-*]\s+/.test(l));
      if (isList) {
        const items = lines.map((l) => `<li>${inlineMarkdown(l.replace(/^[-*]\s+/, ""))}</li>`).join("");
        return `<ul>${items}</ul>`;
      }
      return `<p>${lines.map(inlineMarkdown).join("<br>")}</p>`;
    }).join("");
    return `<div class="bubble-md">${html}</div>`;
  }
  function inlineMarkdown(line) {
    return line
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
  }

  const reduceMotionPref = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatToBottom(smooth) {
    const host = document.getElementById("chatMessages");
    if (!host) return;
    host.scrollTo({ top: host.scrollHeight, behavior: smooth && !reduceMotionPref ? "smooth" : "auto" });
  }
  // New user messages -> bottom. Long assistant replies -> align to the
  // reply's first line so the person starts reading at the top, not the end.
  function revealNewMessage(el, role) {
    const host = document.getElementById("chatMessages");
    const smooth = reduceMotionPref ? "auto" : "smooth";
    if (role === "assistant" && el.offsetHeight > host.clientHeight * 0.7) {
      host.scrollTo({ top: Math.max(0, el.offsetTop - 12), behavior: smooth });
    } else {
      scrollChatToBottom(true);
    }
  }
  function updateScrollBtn() {
    const host = document.getElementById("chatMessages");
    const btn = document.getElementById("chatScrollBtn");
    if (!host || !btn) return;
    const away = host.scrollHeight - host.scrollTop - host.clientHeight > 160;
    btn.classList.toggle("show", away && !!host.querySelector(".chat-msg"));
  }
  function formatTime(ts) {
    try { return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; }
  }

  // Sizes the chat panel to the *visible* viewport. On phones the on-screen
  // keyboard shrinks the visual viewport (but not 100vh/dvh on iOS), so we
  // track window.visualViewport and expose --va-vvh / --va-top to the CSS.
  const mobileMQ = window.matchMedia("(max-width: 767.98px)");
  function fitChat() {
    const shell = document.querySelector(".chat-shell");
    if (!shell) return;
    const root = document.documentElement;
    if (!mobileMQ.matches) {
      root.style.removeProperty("--va-vvh");
      root.style.removeProperty("--va-top");
      return;
    }
    const vv = window.visualViewport;
    root.style.setProperty("--va-vvh", (vv ? vv.height : window.innerHeight) + "px");
    root.style.setProperty("--va-top", (shell.getBoundingClientRect().top + window.scrollY) + "px");
    if (document.body.classList.contains("va-typing")) {
      window.scrollTo(0, 0);
      scrollChatToBottom();
    }
  }

  // Where each live-data tool's full detail lives in the app.
  const TOOL_UI = {
    get_current_weather: { href: "weather.html" },
    get_weather_forecast: { href: "weather.html" },
    get_recent_earthquakes: { href: "earthquake.html" },
    get_volcano_status: { href: "volcano.html" },
    get_active_alerts: { href: "alerts.html" },
    get_recent_incidents: { href: "dashboard.html" },
    find_evacuation_centers: { href: "emergency.html#evac" },
    get_emergency_contacts: { href: "emergency.html" },
  };
  function sourcesHtml(sources) {
    if (!Array.isArray(sources) || !sources.length) return "";
    const chips = sources.map((s) => {
      const label = escapeHtml(s.label || "Live data");
      const src = escapeHtml(s.source || "");
      if (!s.ok) {
        return `<span class="src-chip is-off" title="This source couldn't be reached"><i class="bi bi-wifi-off"></i>${label} unavailable</span>`;
      }
      const ui = TOOL_UI[s.tool];
      const inner = `<span class="src-dot" aria-hidden="true"></span>${label}${src ? `<small>${src}</small>` : ""}`;
      return ui
        ? `<a class="src-chip" href="${ui.href}" title="Open ${label} for full details">${inner}</a>`
        : `<span class="src-chip">${inner}</span>`;
    }).join("");
    return `<div class="msg-sources" role="group" aria-label="Live data used for this answer">${chips}</div>`;
  }

  function appendMessage(role, text, animate, ts, sources) {
    const host = document.getElementById("chatMessages");
    const empty = document.getElementById("chatEmptyState");
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = `chat-msg ${role}`;
    // User text is plain text -- escape it so typed/saved "<tags>" can never
    // be interpreted as HTML. Assistant replies are already-rendered HTML.
    const body = role === "user" ? escapeHtml(text) : text;
    const time = ts ? `<time datetime="${new Date(ts).toISOString()}">${formatTime(ts)}</time>` : "";
    const copy = role === "assistant"
      ? '<button type="button" class="msg-copy" aria-label="Copy reply" title="Copy"><i class="bi bi-clipboard"></i></button>'
      : "";
    el.innerHTML = `<div class="chat-avatar ${role}">${role === "user" ? "You" : "AI"}</div><div class="msg-body"><div class="bubble">${body}</div>${role === "assistant" ? sourcesHtml(sources) : ""}<div class="msg-meta">${time}${copy}</div></div>`;
    host.appendChild(el);
    if (animate) {
      RainAnim.animateChatMessage(el, role);
      if (role === "assistant") RainAnim.revealReply(el.querySelector(".bubble"));
      revealNewMessage(el, role);
    }
    updateScrollBtn();
    return el;
  }

  async function copyReply(btn) {
    const bubble = btn.closest(".msg-body").querySelector(".bubble");
    const text = (bubble.innerText || bubble.textContent || "").trim();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0;";
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove();
    }
    if (!ok) return rainToast("Couldn't copy", "bi-exclamation-circle");
    btn.classList.add("copied");
    btn.innerHTML = '<i class="bi bi-check2"></i>';
    setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = '<i class="bi bi-clipboard"></i>'; }, 1600);
  }

  function classifyPrompt(text) {
    const t = text.toLowerCase();
    if (t.includes("earthquake") || t.includes("lindol")) return "earthquake";
    if (t.includes("flood") || t.includes("baha")) return "flood";
    if (t.includes("typhoon") || t.includes("bagyo") || t.includes("weather") || t.includes("panahon") || t.includes("prepare") || t.includes("kit") || t.includes("hakbang")) return "typhoon";
    if (t.includes("volcan") || t.includes("bulkan") || t.includes("eruption") || t.includes("ashfall")) return "volcano";
    if (t.includes("contact") || t.includes("emergency number") || t.includes("numero")) return "contacts";
    return "default";
  }

  // Some questions ask for live numbers the chatbot has no way to know —
  // how many incidents/alerts are near the user right now, today's actual
  // weather, the nearest recent earthquake. Rather than let the AI guess or
  // make something up, these route straight to the RAIN page that already
  // shows that data live (Supabase-backed maps, the weather API proxy, the
  // USGS earthquake feed). Checked before the AI call — no tokens spent,
  // and it works even if the AI/backend is down.
  const DATA_INTENT_REPLIES = {
    en: {
      incidents: { icon: "bi-geo-alt", heading: "Live incident map", intro: "The Situation Map plots every resident-reported incident near you in real time.", cta: { label: "Open incident map", href: "dashboard.html?focus=incidents" } },
      alerts: { icon: "bi-megaphone", heading: "Active alerts", intro: "The Alerts page lists everything currently active for your area.", cta: { label: "View active alerts", href: "alerts.html" } },
      weather: { icon: "bi-cloud-sun", heading: "Current weather", intro: "The Weather page shows live conditions and the forecast for your location.", cta: { label: "Check the weather", href: "weather.html" } },
      earthquake: { icon: "bi-activity", heading: "Latest earthquake data", intro: "The Earthquake page tracks the most recent quakes near the Philippines, including distance and magnitude.", cta: { label: "View recent earthquakes", href: "earthquake.html" } },
      shelters: { icon: "bi-house-heart", heading: "Nearby evacuation centers", intro: "The Situation Map shows the closest evacuation centers and their live status.", cta: { label: "Find evacuation centers", href: "dashboard.html?focus=shelters" } },
      volcano: { icon: "bi-triangle", heading: "Taal Volcano status", intro: "The Volcano page has the reference alert level and monitoring details (check PHIVOLCS for the current official level).", cta: { label: "View volcano monitoring", href: "volcano.html" } },
    },
    fil: {
      incidents: { icon: "bi-geo-alt", heading: "Live na mapa ng insidente", intro: "Ipinapakita ng Situation Map ang lahat ng iniulat na insidente malapit sa iyo, real-time.", cta: { label: "Buksan ang mapa ng insidente", href: "dashboard.html?focus=incidents" } },
      alerts: { icon: "bi-megaphone", heading: "Mga aktibong alerto", intro: "Nakalista sa Alerts page ang lahat ng kasalukuyang aktibo sa inyong lugar.", cta: { label: "Tingnan ang mga alerto", href: "alerts.html" } },
      weather: { icon: "bi-cloud-sun", heading: "Kasalukuyang panahon", intro: "Ipinapakita ng Weather page ang live na kondisyon at forecast para sa inyong lokasyon.", cta: { label: "Tingnan ang panahon", href: "weather.html" } },
      earthquake: { icon: "bi-activity", heading: "Pinakabagong datos ng lindol", intro: "Sinusubaybayan ng Earthquake page ang mga pinakabagong lindol malapit sa Pilipinas, kasama ang distansya at magnitude.", cta: { label: "Tingnan ang mga lindol", href: "earthquake.html" } },
      shelters: { icon: "bi-house-heart", heading: "Pinakamalapit na evacuation center", intro: "Ipinapakita ng Situation Map ang pinakamalapit na evacuation center at kanilang status.", cta: { label: "Hanapin ang evacuation center", href: "dashboard.html?focus=shelters" } },
      volcano: { icon: "bi-triangle", heading: "Status ng Bulkang Taal", intro: "Makikita sa Volcano page ang kasalukuyang alert level at detalye ng monitoring.", cta: { label: "Tingnan ang volcano monitoring", href: "volcano.html" } },
    },
  };

  function detectDataIntent(text) {
    const t = text.toLowerCase();
    // Words that signal a "how do I prepare / what do I do" question --
    // these stay with the AI/demo reply, which gives real guidance and
    // steps. Anything else that names one of these topics is treated as a
    // status/live-data ask and routed straight to the page that has it,
    // rather than requiring specific phrasing like "today" or "status" to
    // trigger the redirect (that gate was letting things like "how is
    // taal" or "weather?" slip through to the AI, which then pointed
    // people at external government sites instead of the app's own pages).
    const prepWords = /(prepare|preparation|paghahanda|paghahandaan|paano.*handa|handa(?!n)|what (should|do) i do|what to do|paano ang gagawin|kit|steps|hakbang|safety tips|dapat gawin)/;
    // Incidents, shelters, and alerts have no legitimate "how do I prepare
    // for an alert" meaning distinct from "what's happening right now" --
    // any mention of them is a request for live data RAIN can't see, so
    // route to the relevant page unconditionally instead of gating on
    // specific phrasing (which is what let "any alerts today?" slip through
    // to the AI before).
    if (/incident/.test(t)) return "incidents";
    if (/(evacuation center|shelter|paglikas)/.test(t)) return "shelters";
    if (/\balert/.test(t) && !/alert level/.test(t)) return "alerts";
    // Earthquake/weather/volcano DO have a legitimate non-live-data meaning
    // ("how do I prepare for an earthquake", "what to do if Taal erupts"),
    // so only skip the redirect when the phrasing clearly asks for
    // preparedness guidance rather than current status.
    if (/taal|bulkang taal/.test(t) && !prepWords.test(t)) return "volcano";
    if (/(epicenter|earthquake|lindol|quake)/.test(t) && !prepWords.test(t)) return "earthquake";
    if (/(weather|panahon|ulan)/.test(t) && !prepWords.test(t)) return "weather";
    return null;
  }

  // One request at a time: stops double-taps / Enter-spam from firing
  // duplicate API calls and interleaving replies out of order.
  let pending = false;
  function setPending(on) {
    pending = on;
    const btn = document.getElementById("chatSendBtn");
    if (btn) { btn.disabled = on; btn.classList.toggle("is-loading", on); }
    const host = document.getElementById("chatMessages");
    if (host) host.setAttribute("aria-busy", on ? "true" : "false");
  }

  async function sendMessage(rawText) {
    const text = (rawText || "").trim();
    if (!text || pending) return;
    setPending(true);
    try {
      await doSend(text);
    } finally {
      setPending(false);
    }
  }

  async function doSend(text) {
    clearFollowups();
    const history = loadHistory();
    const sentAt = Date.now();
    appendMessage("user", text, true, sentAt);
    history.push({ role: "user", message: text, ts: sentAt });
    saveHistory(history);
    const inputEl = document.getElementById("chatInput");
    const keepFocus = document.activeElement === inputEl; // keep mobile keyboard open
    inputEl.value = "";
    if (keepFocus) inputEl.focus({ preventScroll: true });

    // A cheap client-side guess at "this needs live data" -- only used to show
    // a more specific typing label and as the OFFLINE fallback (below). The
    // server-side assistant decides for itself which tools to call.
    const dataIntent = detectDataIntent(text);
    const hintLive = !!dataIntent || /\b(now|today|ngayon|current|latest|nearest|pinakamalapit|forecast|any)\b/i.test(text);
    const host = document.getElementById("chatMessages");
    const typingEl = document.createElement("div");
    typingEl.className = "chat-msg assistant typing";
    typingEl.innerHTML = `<div class="chat-avatar assistant">AI</div><div class="bubble typing-dots" role="status" aria-label="RAIN is typing"><span></span><span></span><span></span>${hintLive ? `<em class="typing-label">${currentLang === "fil" ? "Sinusuri ang live data…" : "Checking live data…"}</em>` : ""}</div>`;
    host.appendChild(typingEl);
    scrollChatToBottom(true);

    // Calls /api/chat.js, which proxies Gemini server-side so the API key
    // never touches the browser. The assistant can look up live weather,
    // earthquakes, Taal status, alerts, incidents and shelters itself (see
    // api/_lib/tools.js) and reports which sources it used.
    //
    // If the request fails (offline, GEMINI_API_KEY not configured, rate
    // limited...) we fall back to what the app can do without the AI: for a
    // live-data question, a quick-link card to the page that has it;
    // otherwise a canned demo reply.
    let reply;
    let displayReply;
    let usedLiveApi = false;
    let sources = [];
    try {
      // RainChatAPI.sendFull() (assets/js/main.js) is the shared client for
      // /api/chat. `reply` stays raw markdown (saved to history and sent back
      // to Gemini as context); displayReply is the rendered HTML.
      const out = await RainChatAPI.sendFull(text, { lang: currentLang, history: history.slice(0, -1) });
      reply = out.reply;
      sources = out.sources;
      displayReply = renderMarkdown(reply);
      usedLiveApi = true;
    } catch (err) {
      console.error("Live chat unavailable, falling back:", err);
      if (dataIntent) {
        reply = rainQuickLinkReply({ tone: "info", ...DATA_INTENT_REPLIES[currentLang][dataIntent] });
      } else {
        reply = RAIN_DEMO.aiReplies[currentLang][classifyPrompt(text)];
      }
      // Fallbacks are pre-built HTML (or plain text) -- show as-is, don't run
      // them through the markdown renderer.
      displayReply = reply;
    }

    typingEl.remove();
    const at = Date.now();
    appendMessage("assistant", displayReply, true, at, sources);
    history.push({ role: "assistant", message: reply, format: usedLiveApi ? "md" : "html", ts: at, sources });
    saveHistory(history);
    showFollowups(INTENT_TO_CATEGORY[dataIntent] || classifyPrompt(text));

    // Minimal usage log (who + when only, never the message content) so
    // the admin dashboard's "Chatbot Usage" chart reflects real activity
    // instead of a hardcoded array. See supabase/004_*.sql.
    if (user) {
      const { error: logError } = await sb.from("chat_logs").insert({ user_id: user.id });
      if (logError) console.error("Chat log error:", logError);
    }
  }

  function initVaPage() {
    const appContent = document.getElementById("app-content");
    appContent.classList.add("va-page");
    appContent.appendChild(document.getElementById("va-content").content.cloneNode(true));
    initializeAnimations();

    // Keep the panel fitted to the visible screen (rotation, keyboard, URL bar).
    const input = document.getElementById("chatInput");
    input.addEventListener("focus", () => {
      if (mobileMQ.matches) document.body.classList.add("va-typing");
      requestAnimationFrame(fitChat);
      setTimeout(fitChat, 300); // after the keyboard animation settles
    });
    input.addEventListener("blur", () => {
      document.body.classList.remove("va-typing");
      requestAnimationFrame(fitChat);
    });
    window.addEventListener("resize", fitChat);
    window.addEventListener("orientationchange", () => setTimeout(fitChat, 250));
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fitChat);
    fitChat();

    const host = document.getElementById("chatMessages");
    const history = loadHistory();
    if (!history.length) {
      host.innerHTML = emptyStateHtml();
      RainAnim.animateChatEmpty(host.firstElementChild);
    } else {
      history.forEach((m) => appendMessage(m.role, m.format === "md" ? renderMarkdown(m.message) : m.message, false, m.ts, m.sources));
      scrollChatToBottom();
    }
    updateScrollBtn();
    host.addEventListener("scroll", updateScrollBtn, { passive: true });
    document.getElementById("chatScrollBtn").addEventListener("click", () => scrollChatToBottom(true));

    // Event delegation: quick-topic buttons only exist in the empty state,
    // which is re-rendered after "Clear Chat", so bind on the container.
    // Clicking any one of them sends that message immediately, which removes
    // the empty state (and the topics with it) — they only ever show once.
    host.addEventListener("click", (e) => {
      const copyBtn = e.target.closest(".msg-copy");
      if (copyBtn) { copyReply(copyBtn); return; }
      const btn = e.target.closest(".va-topic-btn, .va-chip");
      if (btn) sendMessage(btn.dataset.topic);
    });

    document.querySelectorAll(".lang-toggle button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".lang-toggle button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        currentLang = b.dataset.lang;
        if (document.getElementById("chatEmptyState")) {
          host.innerHTML = emptyStateHtml();
          RainAnim.animateChatEmpty(host.firstElementChild);
        }
      });
    });

    document.getElementById("chatForm").addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(document.getElementById("chatInput").value);
    });

    document.getElementById("clearChatBtn").addEventListener("click", () => {
      clearFollowups();
      const msgs = Array.from(host.querySelectorAll(".chat-msg"));
      if (!msgs.length) return;
      let remaining = msgs.length;
      msgs.forEach((m, i) => {
        setTimeout(() => {
          if (window.anime) {
            anime.animate(m, { opacity: [1, 0], translateY: [0, -8], duration: 220, easing: "easeInQuad", onComplete: () => {
              m.remove();
              remaining--;
              if (remaining === 0) { host.innerHTML = emptyStateHtml(); saveHistory([]); RainAnim.animateChatEmpty(host.firstElementChild); updateScrollBtn(); }
            }});
          } else {
            m.remove(); remaining--;
            if (remaining === 0) { host.innerHTML = emptyStateHtml(); saveHistory([]); RainAnim.animateChatEmpty(host.firstElementChild); updateScrollBtn(); }
          }
        }, i * 60);
      });
      rainToast("Chat cleared", "bi-trash3");
    });
  }

  if (user) initVaPage();
</script>
</body>
</html>
