<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("rain_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heat Index — RAIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="app-shell-root"></div>

<template id="heat-content">
  <div class="mb-4"><span class="eyebrow">Heat safety</span>
    <h1 style="font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--canvas-heading);margin:.25rem 0 0;">Heat Index — Tanauan City</h1></div>
  <div id="hiError" class="error-state d-none"><div><strong>Unable to retrieve weather data.</strong></div>
    <button class="btn-rain btn-rain-ghost btn-rain-sm mt-3" id="hiRetry">Retry</button></div>
  <div id="hiLoading" class="rain-card"><span class="skeleton d-block" style="height:120px;"></span></div>
  <div id="hiBody" class="d-none">
    <div class="rain-card mb-4">
      <div class="card-eyebrow"><span>Estimated heat index</span><span class="demo-data-tag" style="background:#b45309">CALCULATED ESTIMATE</span></div>
      <div style="font-size:2.6rem;font-weight:700;" id="hiVal">—</div>
      <div id="hiCat" style="font-weight:600;"></div>
      <div class="mt-2" style="font-size:.85rem;">Temperature <b id="hiT">—</b> · Humidity <b id="hiRH">—</b> · Observation time <b id="hiTime">—</b></div>
      <p class="mt-3 mb-0" id="hiAdvice"></p>
    </div>
    <div class="rain-card mb-4"><div class="card-eyebrow"><span>Forecast (next ~24 h, 3-hourly)</span><span class="demo-data-tag" style="background:#b45309">FORECAST</span></div>
      <div id="hiFc" style="font-size:.85rem;"></div></div>
    <div class="rain-card mb-4" id="aiDigestHeat" style="font-size:.85rem;"></div>
    <div class="rain-card" style="font-size:.8rem;">
      <b>Source &amp; limitations.</b> Temperature and humidity come from OpenWeatherMap (a modeled/blended source, not a PAGASA station).
      The heat index is computed with the U.S. NWS Rothfusz regression (Steadman formula below 80&nbsp;°F), which assumes shade and light wind and
      is least reliable outside about 27–44&nbsp;°C and 40–100% humidity. Categories follow PAGASA's published heat-index classes, but this page is
      <b>not</b> an official PAGASA observation or advisory. For official heat advisories see <a href="https://www.pagasa.dost.gov.ph" target="_blank" rel="noopener">pagasa.dost.gov.ph</a>.
      Historical trends and official PAGASA values are not shown because no verified programmatic source is integrated yet.
    </div>
  </div>
</template>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/rain-auth.js"></script>
<script src="assets/js/offline-store.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/rain-indices.js"></script>
<script src="assets/js/ai-digest-card.js"></script>
<script type="module">
  await RainAuth.init();
  const user = renderAppShell("heat-index.html", { title: "Heat Index" });
  const LAT = 14.0863, LNG = 121.1497; // approximate Tanauan City center (lookup only, not a facility)
  const { heatIndexC, heatCategory } = RainIndices;
  const cat = (c) => heatCategory(c).slice(0, 2);
  const $ = (id) => document.getElementById(id);
  const f1 = (n) => n.toFixed(1) + " °C";
  async function load() {
    $("hiError").classList.add("d-none"); $("hiLoading").classList.remove("d-none"); $("hiBody").classList.add("d-none");
    try {
      const [cur, fc] = await Promise.all([
        fetch(`/api/weather?lat=${LAT}&lng=${LNG}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch(`/api/weather?lat=${LAT}&lng=${LNG}&forecast=1`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      ]);
      if (typeof cur.main?.temp !== "number" || typeof cur.main?.humidity !== "number") throw new Error("missing fields");
      const hi = heatIndexC(cur.main.temp, cur.main.humidity), [name, advice] = cat(hi);
      $("hiVal").textContent = f1(hi); $("hiCat").textContent = name; $("hiAdvice").textContent = advice;
      $("hiT").textContent = f1(cur.main.temp); $("hiRH").textContent = cur.main.humidity + "%";
      $("hiTime").textContent = new Date(cur.dt * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      $("hiFc").innerHTML = (fc.list || []).slice(0, 8).map((x) => {
        const h = heatIndexC(x.main.temp, x.main.humidity);
        return `<div class="d-flex justify-content-between border-bottom py-1"><span>${new Date(x.dt * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}</span><span>${f1(h)} · ${cat(h)[0]}</span></div>`;
      }).join("") || "No forecast data.";
      $("hiLoading").classList.add("d-none"); $("hiBody").classList.remove("d-none");
    } catch (e) { console.warn("heat index", e); $("hiLoading").classList.add("d-none"); $("hiError").classList.remove("d-none"); }
  }
  if (user) {
    $("app-content").appendChild($("heat-content").content.cloneNode(true));
    $("hiRetry").addEventListener("click", load); load();
  }
  RainDigest.mount("aiDigestHeat", "heat");
</script>
</body>
</html>
