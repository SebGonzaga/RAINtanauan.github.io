<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("rain_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mosquito Watch — RAIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="app-shell-root"></div>

<template id="mq-content">
  <div class="mb-3"><span class="eyebrow">Community health</span>
    <h1 style="font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--canvas-heading);margin:.25rem 0 0;">Mosquito Watch — Tanauan City</h1></div>
  <div class="rain-card mb-3" style="font-size:.85rem;border-left:4px solid #b45309;">
    <b>What this page is.</b> Resident <i>reports</i> and a <i>modeled</i> look at weather conditions. It does <b>not</b> measure how many mosquitoes there are,
    and it does not diagnose or predict dengue or any other disease. Report suspected outbreaks to your barangay health office or the City Health Office.
  </div>
  <div class="row g-3 mb-3">
    <div class="col-lg-6"><div class="rain-card h-100" id="mqRisk"><span class="skeleton d-block" style="height:140px;"></span></div></div>
    <div class="col-lg-6"><div class="rain-card h-100" id="mqCommunity" style="font-size:.85rem;">Loading verified reports…</div></div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-lg-6"><div class="rain-card">
      <b>Submit a report</b>
      <div id="mqMsg" class="mt-2" style="font-size:.85rem;"></div>
      <div class="mt-2" style="font-size:.85rem;">
        <label class="form-label-rain">What did you see?</label>
        <select id="mqType" class="form-control form-control-rain mb-2"><option value="stagnant_water">Stagnant water</option><option value="breeding_site">Possible breeding site (containers, tires, clogged drains)</option><option value="sighting">Mosquito sightings</option></select>
        <label class="form-label-rain">Barangay</label>
        <input id="mqBrgy" list="mqBrgyList" class="form-control form-control-rain mb-2" maxlength="80" placeholder="Start typing your barangay"><datalist id="mqBrgyList"></datalist>
        <label class="form-label-rain">Date observed (last 14 days)</label>
        <input id="mqDate" type="date" class="form-control form-control-rain mb-2">
        <label class="form-label-rain">Details (optional, max 500 characters)</label>
        <textarea id="mqDesc" class="form-control form-control-rain mb-2" rows="3" maxlength="500" placeholder="Please do not include names, phone numbers or house numbers."></textarea>
        <label class="form-label-rain">Photo (optional, max 5 MB)</label>
        <input id="mqPhoto" type="file" accept="image/*" class="form-control form-control-rain">
        <div class="text-muted mb-2" style="font-size:.74rem;">Photos are stored in a public bucket. Keep people, faces and house numbers out of the frame.</div>
        <label class="d-block mb-2"><input type="checkbox" id="mqGeo"> Attach my approximate location (rounded to about 100 m)</label>
        <button id="mqSubmit" class="btn-rain btn-rain-primary" type="button">Submit report</button>
        <div class="text-muted mt-2" style="font-size:.74rem;">Limits: 5 reports per 24 hours, no duplicates. Reports start as unverified until an admin reviews them.</div>
      </div></div></div>
    <div class="col-lg-6"><div class="rain-card h-100" style="font-size:.85rem;"><b>Your reports</b><div id="mqMine" class="mt-2">Loading…</div></div></div>
  </div>
  <div class="rain-card mb-3 d-none" id="mqAdmin" style="font-size:.85rem;"><b>Moderation queue (admins)</b><div id="mqQueue" class="mt-2">Loading…</div></div>
  <div class="rain-card" style="font-size:.8rem;"><b>Prevention (DOH "4S")</b>
    <ul class="mb-1 mt-2"><li><b>Search and destroy</b> breeding places: empty or cover containers, tires, flower vases, clogged gutters.</li>
    <li><b>Self-protection:</b> repellent, long sleeves, screens and nets.</li><li><b>Seek early consultation</b> for fever lasting 2+ days.</li>
    <li><b>Say yes to fogging</b> only when health authorities advise it during an outbreak.</li></ul>
    <span class="text-muted">Weather inputs: OpenWeatherMap (modeled/blended, not a mosquito or health data source).</span></div>
</template>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/rain-auth.js"></script>
<script src="assets/js/offline-store.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/rain-indices.js"></script>
<script type="module">
  await RainAuth.init();
  const user = renderAppShell("mosquito.html", { title: "Mosquito Watch" });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const TYPE = { sighting: "Mosquito sightings", breeding_site: "Possible breeding site", stagnant_water: "Stagnant water" };
  const STAT = { pending: "Unverified (awaiting review)", verified: "Verified by admin", rejected: "Rejected" };
  const LAT = 14.0863, LNG = 121.1497; // approx. city center, weather lookup only
  $("app-content").appendChild($("mq-content").content.cloneNode(true));
  if (!user) throw new Error("not signed in");
  const isAdmin = RainAuth.isAdmin(user);
  const iso = (d) => d.toISOString().slice(0, 10);
  $("mqDate").max = iso(new Date()); $("mqDate").min = iso(new Date(Date.now() - 14 * 864e5)); $("mqDate").value = iso(new Date());

  // Barangay suggestions from the official list (free text still allowed)
  fetch("data/tanauan-barangay-list.csv").then((r) => r.text()).then((t) => {
    $("mqBrgyList").innerHTML = t.split(/\r?\n/).slice(1).map((l) => l.split(",")[0]).filter(Boolean).map((n) => `<option value="${esc(n)}">`).join("");
  }).catch(() => {});

  // ---- Modeled environmental suitability (transparent rules, not validated for Tanauan) ----
  async function loadRisk() {
    try {
      const get = (q) => fetch(`/api/weather?lat=${LAT}&lng=${LNG}${q}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const [cur, fc] = await Promise.all([get(""), get("&forecast=1")]);
      const T = cur.main?.temp, RH = cur.main?.humidity;
      if (typeof T !== "number" || typeof RH !== "number") throw new Error("missing fields");
      const rainNow = cur.rain?.["1h"] ?? 0, rain5 = (fc.list || []).reduce((s, x) => s + (x.rain?.["3h"] || 0), 0);
      const F = [
        { name: "Temperature", ok: T >= 25 && T <= 32, val: T.toFixed(1) + " °C", rule: "favorable if 25–32 °C (warm range where mosquito development is generally faster)" },
        { name: "Humidity", ok: RH >= 70, val: RH + "%", rule: "favorable if 70% or higher" },
        { name: "Rain", ok: rainNow > 0 || rain5 >= 20, val: `${rainNow.toFixed(1)} mm last hour; ${rain5.toFixed(0)} mm forecast over ~5 days`, rule: "favorable if raining now or 20 mm+ is forecast (standing water)" },
      ], n = F.filter((f) => f.ok).length, label = ["Low", "Low", "Moderate", "High"][n];
      $("mqRisk").innerHTML = `<div class="card-eyebrow"><span>Environmental suitability for mosquito breeding</span><span class="demo-data-tag" style="background:#b45309">MODELED</span></div>
        <div style="font-size:1.8rem;font-weight:700;">${label} <small style="font-size:.9rem;">(${n} of 3 conditions favorable)</small></div>
        <table class="mt-2" style="font-size:.8rem;width:100%;">${F.map((f) => `<tr><td>${f.ok ? "✔" : "✘"} <b>${f.name}</b></td><td>${esc(f.val)}</td></tr><tr><td colspan="2" class="text-muted">${esc(f.rule)}</td></tr>`).join("")}</table>
        <div class="text-muted mt-2" style="font-size:.74rem;">Simplified rules of thumb, not a validated model; says nothing about actual mosquito numbers or disease. Observed ${esc(new Date(cur.dt * 1000).toLocaleString())}. Past-week rainfall is not included (no verified source).</div>`;
    } catch (e) { console.warn("mq risk", e); $("mqRisk").innerHTML = "Weather conditions could not be loaded right now."; }
  }

  async function loadCommunity() {
    try {
      const since = iso(new Date(Date.now() - 30 * 864e5));
      const { data, error } = await sb.from("mosquito_reports_public").select("report_type,barangay").gte("observed_on", since).limit(1000);
      if (error) throw error;
      const by = {}; (data || []).forEach((r) => { by[r.barangay] = (by[r.barangay] || 0) + 1; });
      const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 5);
      $("mqCommunity").innerHTML = `<div class="card-eyebrow"><span>Verified community reports, last 30 days</span><span class="demo-data-tag" style="background:#b45309">COMMUNITY REPORTS</span></div>
        <div style="font-size:1.8rem;font-weight:700;">${(data || []).length}</div>
        ${top.length ? "Most reports: " + top.map(([b, c]) => esc(b) + " (" + c + ")").join(", ") : "No verified reports yet."}
        <div class="text-muted mt-2" style="font-size:.74rem;">Counts reflect who reports and where, not mosquito density. Few reports can mean few reporters.</div>`;
    } catch (e) { console.warn("mq community", e); $("mqCommunity").textContent = "Reports could not be loaded (has migration 006 been run?)."; }
  }

  async function loadMine() {
    try {
      const { data, error } = await sb.from("mosquito_reports").select("id,report_type,barangay,observed_on,status").eq("reporter_id", user.id).order("created_at", { ascending: false }).limit(10);
      if (error) throw error;
      $("mqMine").innerHTML = (data || []).map((r) => `<div class="border-bottom py-1">${esc(TYPE[r.report_type])} · ${esc(r.barangay)} · ${esc(r.observed_on)}<br><small>${esc(STAT[r.status])}</small></div>`).join("") || "You have not submitted any reports.";
    } catch (e) { $("mqMine").textContent = "Could not load your reports."; }
  }

  async function loadQueue() {
    if (!isAdmin) return;
    $("mqAdmin").classList.remove("d-none");
    try {
      const { data, error } = await sb.from("mosquito_reports").select("*").eq("status", "pending").order("created_at").limit(50);
      if (error) throw error;
      $("mqQueue").innerHTML = (data || []).map((r) => `<div class="border-bottom py-2"><b>${esc(TYPE[r.report_type])}</b> · ${esc(r.barangay)} · ${esc(r.observed_on)}
        <div>${esc(r.description || "(no details)")}</div>${r.photo_url ? `<a href="${esc(r.photo_url)}" target="_blank" rel="noopener noreferrer">photo</a> ` : ""}
        <button class="btn-rain btn-rain-primary btn-rain-sm" data-id="${esc(r.id)}" data-s="verified">Verify</button>
        <button class="btn-rain btn-rain-ghost btn-rain-sm" data-id="${esc(r.id)}" data-s="rejected">Reject</button></div>`).join("") || "Nothing pending.";
    } catch (e) { $("mqQueue").textContent = "Could not load the queue."; }
  }
  $("mqQueue").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-s]"); if (!b) return; b.disabled = true;
    const { error } = await sb.from("mosquito_reports").update({ status: b.dataset.s }).eq("id", b.dataset.id);
    if (error) { rainToast("Update failed", "bi-exclamation-triangle"); b.disabled = false; return; }
    loadQueue(); loadCommunity();
  });

  const say = (t, bad) => { $("mqMsg").style.color = bad ? "#dc2626" : "#15803d"; $("mqMsg").textContent = t; };
  $("mqSubmit").addEventListener("click", async () => {
    const barangay = $("mqBrgy").value.trim(), observed_on = $("mqDate").value, file = $("mqPhoto").files[0];
    if (barangay.length < 2) return say("Please enter your barangay.", true);
    if (!observed_on) return say("Please choose the date you saw it.", true);
    if (file && (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024)) return say("Photo must be an image under 5 MB.", true);
    $("mqSubmit").disabled = true; say("Submitting…");
    try {
      let lat = null, lng = null;
      if ($("mqGeo").checked) {
        try { const p = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 8000 })); lat = +p.coords.latitude.toFixed(3); lng = +p.coords.longitude.toFixed(3); }
        catch (e) { say("Location unavailable; submitting without it…"); }
      }
      let photo_url = null;
      if (file) {
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "jpg";
        const path = `${user.id}/mosquito-${Date.now()}.${ext}`; // same bucket/folder rule as incident photos
        const up = await sb.storage.from("incident-photos").upload(path, file);
        if (up.error) say("Photo upload failed; submitting without it…"); else photo_url = sb.storage.from("incident-photos").getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from("mosquito_reports").insert({ report_type: $("mqType").value, barangay, description: $("mqDesc").value.trim() || null, observed_on, lat, lng, photo_url, reporter_id: user.id });
      if (error) throw error;
      say("Thank you. Your report was submitted and is awaiting review."); $("mqDesc").value = ""; $("mqPhoto").value = ""; loadMine(); loadQueue();
    } catch (e) { say(/Too many|Duplicate|within the last/.test(e.message || "") ? e.message : "Could not submit the report. Please try again.", true); }
    $("mqSubmit").disabled = false;
  });

  loadRisk(); loadCommunity(); loadMine(); loadQueue();
</script>
</body>
</html>
