<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("rain_theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Management — RAIN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1830">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
<div id="app-shell-root"></div>

<template id="admin-users-content">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
    <div>
      <span class="eyebrow">Accounts</span>
      <h1 style="font-family:var(--font-display); font-weight:700; font-size:1.4rem; color:var(--canvas-heading); margin:.25rem 0 0;">User management</h1>
    </div>
    <input type="search" class="form-control form-control-rain" id="userSearch" placeholder="Search by name or email…" style="max-width:260px;">
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="rain-card rain-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Total Accounts</span><span class="icon-chip tone-cyan"><i class="bi bi-people dicon" data-dicon="people"></i></span></div>
        <h3 class="card-num" id="uTotal">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="rain-card rain-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Administrators</span><span class="icon-chip tone-warning"><i class="bi bi-shield-check dicon" data-dicon="shield-check"></i></span></div>
        <h3 class="card-num" id="uAdmins">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="rain-card rain-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Residents</span><span class="icon-chip tone-safe"><i class="bi bi-house dicon" data-dicon="house"></i></span></div>
        <h3 class="card-num" id="uResidents">0</h3>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="rain-card rain-card-dark reveal-on-scroll">
        <div class="card-eyebrow"><span>Suspended</span><span class="icon-chip tone-critical"><i class="bi bi-slash-circle dicon" data-dicon="slash-circle"></i></span></div>
        <h3 class="card-num" id="uSuspended">0</h3>
      </div>
    </div>
  </div>

  <div class="rain-card reveal-on-scroll">
    <div class="card-eyebrow"><span>All accounts</span></div>
    <div class="table-rain-wrap cards-on-mobile">
      <table class="table-rain">
        <thead>
          <tr><th>Name</th><th>Email</th><th>City</th><th>Role</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/lib/anime.iife.min.js"></script>
<script src="assets/js/animations.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/rain-auth.js"></script>
<script src="assets/js/offline-store.js"></script>
<script src="assets/js/main.js"></script>
<script type="module">
  await RainAuth.init();
  const user = renderAppShell("admin-users.html", { title: "User Management" });
  if (user && !RainAuth.isAdmin(user)) { window.location.href = "dashboard.html"; }

  // profiles.role is the DB enum ('resident'/'admin'); the UI shows the
  // same friendly labels RainAuth already uses elsewhere.
  const roleLabel = (role) => (role === "admin" ? "Administrator" : "Community Resident");

  // PostgREST caps a single request at 1000 rows by default, so a plain
  // .select() silently truncates once the table grows past that — which
  // made this page's totals drift from the dashboard's exact count()
  // query. Page through in batches of 1000 until a short page tells us
  // we've hit the end, so this always reflects every row.
  const FETCH_PAGE_SIZE = 1000;
  async function fetchProfiles() {
    const all = [];
    let from = 0;
    while (true) {
      const { data, error } = await sb
        .from("profiles")
        .select("id, full_name, email, barangay, role, status")
        .order("created_at", { ascending: false })
        .range(from, from + FETCH_PAGE_SIZE - 1);
      if (error) { console.error("Fetch profiles error:", error); return all; }
      all.push(...data);
      if (data.length < FETCH_PAGE_SIZE) break;
      from += FETCH_PAGE_SIZE;
    }
    return all;
  }

  async function renderUsers(query) {
    const all = await fetchProfiles();
    document.getElementById("uTotal").textContent = all.length;
    document.getElementById("uAdmins").textContent = all.filter((u) => u.role === "admin").length;
    document.getElementById("uResidents").textContent = all.filter((u) => u.role === "resident").length;
    document.getElementById("uSuspended").textContent = all.filter((u) => u.status === "suspended").length;

    const q = (query || "").trim().toLowerCase();
    const filtered = q ? all.filter((u) => (u.full_name || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q)) : all;

    const body = document.getElementById("usersTableBody");
    body.innerHTML = "";
    filtered.forEach((u) => {
      const isSelf = u.id === user.id;
      const isSuspended = u.status === "suspended";
      const isAdminRole = u.role === "admin";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td data-label="Name"><strong>${u.full_name}</strong>${isSelf ? ' <span class="cell-muted">(you)</span>' : ""}</td>
        <td data-label="Email" class="cell-muted">${u.email || "—"}</td>
        <td data-label="City" class="cell-muted">${u.barangay || "—"}</td>
        <td data-label="Role"><span class="status-badge ${isAdminRole ? "status-warning" : "status-safe"}">${roleLabel(u.role)}</span></td>
        <td data-label="Status"><span class="status-badge ${isSuspended ? "status-critical" : "status-safe"}">${isSuspended ? "Suspended" : "Active"}</span></td>
        <td class="text-end row-actions">
          <div class="d-flex gap-1 justify-content-end flex-wrap">
            <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" data-action="toggle-role" data-id="${u.id}" ${isSelf ? "disabled" : ""}>${isAdminRole ? "Make Resident" : "Make Admin"}</button>
            <button type="button" class="btn-rain btn-rain-ghost btn-rain-sm" data-action="toggle-status" data-id="${u.id}" ${isSelf ? "disabled" : ""}>${isSuspended ? "Reactivate" : "Suspend"}</button>
          </div>
        </td>`;
      body.appendChild(tr);
    });
  }

  function initAdminUsersPage() {
    document.getElementById("app-content").appendChild(document.getElementById("admin-users-content").content.cloneNode(true));
    initializeAnimations();
    renderUsers("");

    document.getElementById("userSearch").addEventListener("input", (e) => renderUsers(e.target.value));

    document.getElementById("usersTableBody").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn || btn.disabled) return;
      const id = btn.dataset.id;
      const all = await fetchProfiles();
      const target = all.find((u) => u.id === id);
      if (!target) return;

      if (btn.dataset.action === "toggle-role") {
        const nextRole = target.role === "admin" ? "resident" : "admin";
        const { error } = await sb.from("profiles").update({ role: nextRole }).eq("id", id);
        if (error) { console.error("Update role error:", error); rainToast("Could not update role", "bi-exclamation-triangle"); return; }
        rainToast(`${target.full_name} is now ${roleLabel(nextRole)}`, "bi-check-circle");
      } else if (btn.dataset.action === "toggle-status") {
        const nextStatus = target.status === "suspended" ? "active" : "suspended";
        const { error } = await sb.from("profiles").update({ status: nextStatus }).eq("id", id);
        if (error) { console.error("Update status error:", error); rainToast("Could not update status", "bi-exclamation-triangle"); return; }
        rainToast(nextStatus === "suspended" ? `${target.full_name} suspended` : `${target.full_name} reactivated`, nextStatus === "suspended" ? "bi-slash-circle" : "bi-check-circle");
      }
      renderUsers(document.getElementById("userSearch").value);
    });
  }

  if (user && RainAuth.isAdmin(user)) initAdminUsersPage();
</script>
</body>
</html>
